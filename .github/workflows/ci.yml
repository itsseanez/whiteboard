name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: testpass
      WHITEBOARD_APP_PASSWORD: apppass
      WHITEBOARD_SIGNUP_PASSWORD: signuppass
      WHITEBOARD_PUBLIC_PASSWORD: publicpass
      WHITEBOARD_AUTH_PASSWORD: authpass

      DATABASE_URL: postgresql://whiteboard:testpass@localhost:5432/whiteboard_test
      APP_DATABASE_URL: postgresql://whiteboard_app:apppass@localhost:5432/whiteboard_test
      SIGNUP_DATABASE_URL: postgresql://whiteboard_signup:signuppass@localhost:5432/whiteboard_test
      PUBLIC_DATABASE_URL: postgresql://whiteboard_public:publicpass@localhost:5432/whiteboard_test
      TEST_DATABASE_URL: postgresql://whiteboard:testpass@localhost:5432/whiteboard_test
      AUTH_DATABASE_URL: postgresql://whiteboard_auth:authpass@localhost:5432/whiteboard_test

      BETTER_AUTH_SECRET: not-a-real-secret-ci-only

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: whiteboard
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: whiteboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Migrate
        working-directory: backend
        run: npm run migrate:test up

      - name: Seed
        working-directory: backend
        run: npm run seed

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Test
        working-directory: backend
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/itsseanez/whiteboard-backend:${{ github.sha }}
            ghcr.io/itsseanez/whiteboard-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::174683182383:role/whiteboard-github-deploy
          aws-region: us-east-1

      - name: Deploy
        env:
          INSTANCE_ID: i-0c55a9f3df7256f06
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ github.sha }}" \
            --parameters "commands=[\"sudo -u ubuntu /opt/whiteboard/deploy.sh ${{ github.sha }}\"]" \
            --query 'Command.CommandId' --output text)

          echo "Command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)

          [ "$STATUS" = "Success" ] || exit 1